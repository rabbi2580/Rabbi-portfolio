<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarif Ul Haider Rabbi | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --primary: #00f5c4;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Open Sans', sans-serif;
      line-height: 1.7;
      color: #333;
      background: #f8f9fa;
    }
    .primary-text { color: var(--primary); }

    /* Navigation */
    .header {
      background: #fff;
      box-shadow: 0 2px 15px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 8%;
    }
    .nav-title {
      font-size: 1.9rem;
      font-weight: 700;
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: 2.2rem;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: #222;
      font-weight: 500;
    }
    .button-primary {
      background: var(--primary);
      color: #000;
      padding: 11px 26px;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .button-primary:hover {
      background: #00d4a8;
      transform: translateY(-3px);
    }

    /* Banner */
    .banner {
      display: flex;
      align-items: center;
      padding: 6rem 8%;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      color: white;
      gap: 4rem;
      min-height: 100vh;
    }
    .banner-content { flex: 1; }
    .banner-greeting { font-size: 1.4rem; margin-bottom: 8px; }
    .banner-name { font-size: 3.8rem; margin-bottom: 16px; line-height: 1.1; }
    .banner-para {
      font-size: 1.15rem;
      max-width: 520px;
      margin-bottom: 30px;
      opacity: 0.95;
    }

    /* Moving Glowing Circle */
    .banner-circle {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      border: 8px solid var(--primary);
      box-shadow: 0 0 40px #00f5c4,
                  0 0 80px #00f5c4,
                  0 0 120px rgba(0, 245, 196, 0.6);
      animation: pulse-glow 4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 40px #00f5c4,
                    0 0 80px #00f5c4,
                    0 0 120px rgba(0, 245, 196, 0.6);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 60px #00f5c4,
                    0 0 110px #00f5c4,
                    0 0 160px rgba(0, 245, 196, 0.8);
        transform: scale(1.08);
      }
      100% {
        box-shadow: 0 0 40px #00f5c4,
                    0 0 80px #00f5c4,
                    0 0 120px rgba(0, 245, 196, 0.6);
        transform: scale(1);
      }
    }

    /* Sections */
    section {
      padding: 90px 8%;
    }
    .section-title {
      font-size: 2.4rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .section-desc {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 4rem;
      color: #444;
      font-size: 1.1rem;
    }

    /* Rest of your styles (About, Skills, etc.) */
    .about-items, .skill-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .about-item, .skills {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.06);
    }

    @media (max-width: 768px) {
      .banner { flex-direction: column; text-align: center; }
      .banner-circle { width: 260px; height: 260px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav>
      <h3 class="nav-title">Haider<span class="primary-text">.</span></h3>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#resume">Resume</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><button class="button-primary">Hire Me</button></li>
      </ul>
    </nav>

    <div class="banner">
      <div class="banner-content">
        <h3 class="banner-greeting">Hi, I am</h3>
        <h1 class="banner-name">Tarif Ul Haider Rabbi</h1>
        <p class="banner-para">
          CSE Student | AI & Machine Learning Enthusiast | Passionate Problem Solver
        </p>
        <button class="button-primary" style="margin-right: 20px;">Download CV</button>
        <button class="button-primary">Contact Me</button>
      </div>
      <div class="banner-circle"></div>
    </div>
  </header>

  <!-- Your other sections remain the same (About, Skills, Resume, Projects, Footer) -->
  <!-- Paste them here if you want full code again, but the main change is above -->

  <footer style="background:#0a0a0f; color:white; padding:60px 8%; text-align:center;">
    <p>© 2026 Tarif Ul Haider Rabbi</p>
  </footer>

</body>
</html>
